services:
  db:
    image: postgres:16-alpine
    container_name: ac-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automatic_champion
    ports:
      # Host port defaults to 5432; override with DB_HOST_PORT in .env on
      # machines where 5432 is already taken (e.g. a native Postgres install).
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
